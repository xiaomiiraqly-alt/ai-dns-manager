# Experimental DNS forwarder. Bound to host loopback only.
# Does NOT alter AmneziaWG, systemd-resolved, or host firewall.
services:
  ai-dns:
    build: .
    image: ai-dns-manager:local
    container_name: ai-dns-manager
    restart: unless-stopped
    command: ["python", "-m", "ai_dns_manager.server", "--config", "/app/config/router.json", "--listen", "0.0.0.0", "--port", "5353"]
    entrypoint: []
    ports:
      - "127.0.0.1:5353:5353/udp"
      - "127.0.0.1:5353:5353/tcp"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
